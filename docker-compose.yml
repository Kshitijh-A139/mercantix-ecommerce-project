services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:mysql://host.docker.internal:3306/mercantix?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
