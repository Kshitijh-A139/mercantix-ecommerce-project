# Test profile — in-memory H2 so the Spring context loads without a live MySQL.
# Hibernate creates the schema from the entities; Flyway is disabled here
# (the MySQL-specific migrations are exercised against a real MySQL in CI/dev).

spring.datasource.url=jdbc:h2:mem:mercantix_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=false

# Deterministic JWT secret for tests (>= 64 bytes)
jwt.secret=test-only-secret-key-that-is-at-least-64-bytes-long-aaaaaaaaaaaaaaaa
jwt.expiration=3600000

logging.level.org.hibernate.SQL=WARN
logging.level.com.mercantix=WARN
