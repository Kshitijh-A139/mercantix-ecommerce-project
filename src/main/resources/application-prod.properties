# Production profile — strict, quiet, safe.
# All sensitive values MUST come from environment variables.

# Never run schema mutations in prod — Flyway (db/migration) owns the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hide stack traces and binding errors from public responses
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Larger pool for prod (override via DB_POOL_SIZE env var)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:25}

# Logging — JSON-friendly, info-only
logging.level.root=WARN
logging.level.com.mercantix=INFO
logging.level.org.springframework.security=WARN

# Actuator health show-details never (already in base) — re-asserted here for clarity.
management.endpoint.health.show-details=never
