spring.application.name=Mercantix

# Active profile — override with `--spring.profiles.active=prod` or SPRING_PROFILES_ACTIVE
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Server ─────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:9090}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.error.include-message=always
server.error.include-binding-errors=always
server.shutdown=graceful

# ── Database ───────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/mercantix?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP defaults are sensible — tune in prod profile only)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=20000

# ── Hibernate ──────────────────────────────────────────────────────────
# Flyway owns the schema (see db/migration). Hibernate only validates that the
# mapped entities match the migrated tables — it never mutates the schema.
spring.jpa.hibernate.ddl-auto=${JPA_DDL:validate}
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway (versioned DB migrations) ────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate lets Flyway adopt a pre-existing (non-empty) database;
# baseline-version=0 ensures V1+ still run on top of that baseline.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── Jackson ────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ── JWT ────────────────────────────────────────────────────────────────
# DEV ONLY DEFAULT. In prod, MUST be overridden with JWT_SECRET env var (64+ random bytes).
jwt.secret=${JWT_SECRET:dev-only-please-change-secret-64-bytes-or-more-aaaaaaaaaaaaaaaaaaaaa}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── CORS ───────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ── Multipart ─────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Actuator (health probes for orchestrators) ────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
