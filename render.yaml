services:
  # ── Backend: Spring Boot (Docker) ──────────────────────────────────────────
  - type: web
    name: mercantix-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        value: https://mercantix-app.onrender.com

  # ── Frontend: React static site ────────────────────────────────────────────
  - type: web
    name: mercantix-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mercantix-backend.onrender.com
      - key: VITE_ADMIN_MOCKS
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
